# Funfair on Fly.io: `fly launch --copy-config` then `fly deploy`.
# Websockets and TLS come for free, and the host screen shows the public URL
# for phones to join.
app = "funfair"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  # A party game should stay up for the whole party: no cold starts mid-round.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
